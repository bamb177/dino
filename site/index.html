<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dino AR Cutout (DeX)</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="top">
    <div class="title">Dino AR Cutout</div>
    <div class="sub">
      A4 템플릿(모서리 마커)로 그린 그림을 촬영하면, 그림(공룡/동물)을 투명 PNG로 추출합니다.
      <a href="./template.html" style="color:#9fd0ff; font-weight:800; text-decoration:none;">A4 템플릿 인쇄</a>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <div class="card-h">
        <div class="h">카메라</div>
        <div id="cvStatus" class="status">OpenCV 로딩 중...</div>
      </div>

      <video id="video" playsinline autoplay muted></video>

      <div class="btns">
        <button id="btnStart" class="primary" disabled>카메라 시작</button>
        <button id="btnCapture" disabled>캡처 & 추출</button>
        <button id="btnDownload" disabled>PNG 다운로드</button>
      </div>

      <div class="tips">
        중요: 템플릿의 네 모서리 마커 4개가 화면에 모두 보이게 촬영하세요. 마커가 흐리면 인식이 실패합니다.
      </div>

      <div id="log" class="status" style="margin-top:10px;"></div>
    </section>

    <section class="card">
      <div class="card-h">
        <div class="h">결과</div>
        <div id="meta" class="status"></div>
      </div>

      <canvas id="outCanvas" width="960" height="540"></canvas>
      <div class="preview">
        <img id="outImg" alt="result png" />
      </div>
    </section>
  </main>

  <!-- OpenCV.js -->
  <script async src="https://docs.opencv.org/4.x/opencv.js" type="text/javascript"></script>
  <script src="./app.js"></script>
</body>
</html>
