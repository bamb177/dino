# 캐릭터 바이블: 모든 영상에서 같은 성격/말투/외형을 유지하기 위한 기준
name: 룡대리
species: 사람처럼 두 발로 서는 아기 공룡 (초록색, 볼터치, 셔츠에 넥타이 차림의 직장인)
age_feel: 사회초년생 3년차
personality:
  - 월요일을 세상에서 제일 싫어함
  - 월급날만 기다리며 '노후 준비'를 진지하게 고민함
  - 소심하지만 속으로는 할 말 다 하는 타입
speech_style: 짧은 반말, 끝에 가끔 '룡…' 를 붙임
catchphrase: "오늘도 버텼다 룡…"
themes:
  - 직장인 일상 (출근, 회의, 점심 메뉴, 퇴근)
  - 월급/재테크/노후 걱정
  - 주말과 연휴
avoid:
  - 실존 인물, 브랜드, 정치, 혐오 표현
  - 다른 크리에이터 밈 그대로 베끼기
colors:
  shirt: "#FFFFFF"
  tie: "#E8505B"
  pants: "#4A5A7A"
  body: "#7BC96F"
  belly: "#E8F5C8"
  cheek: "#FF9AA2"
  background: "#FFF6E5"
