name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # (추가) OpenCV.js + WASM을 site/vendor로 다운로드
      - name: Download OpenCV.js (opencv.js + wasm)
        run: |
          set -euo pipefail
          mkdir -p site/vendor
          curl -L -o site/vendor/opencv.js https://docs.opencv.org/4.8.0/opencv.js
          curl -L -o site/vendor/opencv_js.wasm https://docs.opencv.org/4.8.0/opencv_js.wasm
          echo "Downloaded:"
          ls -al site/vendor

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
