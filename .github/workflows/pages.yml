name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # (추가) OpenCV.js + WASM을 site/vendor로 다운로드
      - name: Download OpenCV.js (opencv.js + wasm)
        run: |
          set -euo pipefail
          mkdir -p site/vendor
          curl -L -o site/vendor/opencv.js https://docs.opencv.org/4.8.0/opencv.js
          curl -L -o site/vendor/opencv_js.wasm https://docs.opencv.org/4.8.0/opencv_js.wasm
          echo "Downloaded:"
          ls -al site/vendor

      # 퇴사 계산기 테스트 후 /quit-calc/ 경로로 함께 배포
      - name: Test quit-calc
        run: node tools/quit-calc/calc.test.js

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          mkdir -p _site/quit-calc
          cp -r tools/quit-calc/. _site/quit-calc/
          rm -rf _site/quit-calc/calc.test.js _site/quit-calc/README.md _site/quit-calc/content _site/quit-calc/scripts

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
