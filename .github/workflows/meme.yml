name: Make meme short

on:
  # 월/수/금 18:00 KST (09:00 UTC). 스케줄은 기본 브랜치(main)에 머지된 뒤부터 동작합니다.
  schedule:
    - cron: "0 9 * * 1,3,5"
  workflow_dispatch:
    inputs:
      topic:
        description: "주제 (비우면 매니저 Claude 가 트렌드에서 고름)"
        required: false
      provider:
        description: "영상 방식 (비우면 저장소 변수 VIDEO_PROVIDER, 없으면 local)"
        type: choice
        options: ["", local, grok]
        default: ""
      publish:
        description: "업로드 (비우면 저장소 변수 AUTO_PUBLISH 가 true 일 때만 유튜브 업로드)"
        type: choice
        options: ["", none, youtube]
        default: ""
      youtube_privacy:
        description: "유튜브 공개 범위 (비우면 저장소 변수 YT_PRIVACY, 없으면 private)"
        type: choice
        options: ["", private, unlisted, public]
        default: ""

# 업로드한 영상 기록(data/history.json)을 커밋하기 위해 필요
permissions:
  contents: write

concurrency:
  group: meme-short
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg + Korean fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Manager Claude -> video -> (optional) upload
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TOPIC: ${{ inputs.topic }}
          PROVIDER: ${{ inputs.provider || vars.VIDEO_PROVIDER || 'local' }}
          PUBLISH: ${{ inputs.publish || (vars.AUTO_PUBLISH == 'true' && 'youtube' || 'none') }}
          PRIVACY: ${{ inputs.youtube_privacy || vars.YT_PRIVACY || 'private' }}
        run: |
          args=(--provider "$PROVIDER" --publish "$PUBLISH" --youtube-privacy "$PRIVACY")
          if [ -n "$TOPIC" ]; then args+=(--topic "$TOPIC"); fi
          python run.py "${args[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meme-short
          path: out/

      - name: Commit upload history
        if: success()
        run: |
          if [ -n "$(git status --porcelain data/history.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/history.json
            git commit -m "chore: record uploaded short [skip ci]"
            git push
          fi
