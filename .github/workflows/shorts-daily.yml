name: Shorts - 매일 영상 만들기

on:
  schedule:
    - cron: "0 23 * * *"   # 매일 오전 8시 (한국 시간)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: shorts-make

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: shorts/requirements.txt
      - name: 도구 설치
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-cjk espeak-ng
          pip install -r shorts/requirements.txt
      - name: 영상 만들기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::error::ANTHROPIC_API_KEY 시크릿이 없어요. README의 2단계를 확인하세요."; exit 1; fi
          python -m shorts make --out out | tee make.log
      - name: 검수 이슈 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(grep '^VIDEO_ID=' make.log | cut -d= -f2)
          TITLE=$(python -c "import json;print(json.load(open('out/$ID.json'))['title'])")
          gh label create review   --color FBCA04 --force >/dev/null
          gh label create approved --color 0E8A16 --force >/dev/null
          gh label create rejected --color B60205 --force >/dev/null
          gh release create "short-$ID" "out/$ID.mp4" "out/$ID.json" \
            --title "$TITLE" --notes "검수용 영상" --prerelease
          URL=$(gh release view "short-$ID" --json url -q .url)
          sed -i "s#아래 \*\*Release\*\* 링크#[Release 페이지]($URL)#" out/issue.md
          gh issue create --title "[검수] $TITLE" --body-file out/issue.md --label review
      - name: 기록 저장 (같은 주제 반복 방지)
        run: |
          git config user.name "shorts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/history.json
          git commit -m "shorts: history update" || exit 0
          git push
